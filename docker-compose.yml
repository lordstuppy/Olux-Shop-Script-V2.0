# Local and test stack: app (PHP-FPM), web (nginx), db (PostgreSQL 15),
# queue worker, scheduler, and shkeeper-mock (Shkeeper API emulator).
# Production: replace shkeeper-mock with a real Shkeeper instance and set
# SHKEEPER_BASE_URL / SHKEEPER_API_KEY / SHKEEPER_WEBHOOK_SECRET in .env.

x-app: &app
  build: .
  image: digital-goods-shop:latest
  env_file: .env
  environment:
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-shop}
    DB_USERNAME: ${DB_USERNAME:-shop}
    DB_PASSWORD: ${DB_PASSWORD:-shop}
    LOG_CHANNEL: json
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
    CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
  volumes:
    - storage:/var/www/html/storage
  # Hardening: read-only root filesystem, no Linux capabilities, no privilege
  # escalation. Writable paths are the storage volume and two tmpfs mounts.
  read_only: true
  tmpfs:
    - /tmp
    - /var/www/html/bootstrap/cache:uid=82,gid=82
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-shop}
      DB_USERNAME: ${DB_USERNAME:-shop}
      DB_PASSWORD: ${DB_PASSWORD:-shop}
      LOG_CHANNEL: json
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      # Only the app container runs migrations at start-up.
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=1", "--sleep=1", "--max-time=3600"]
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  web:
    # Unprivileged nginx (runs as uid 101, listens on 8080) so it can drop all capabilities.
    image: nginxinc/nginx-unprivileged:1.27-alpine
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      - app
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-shop}
      POSTGRES_USER: ${DB_USERNAME:-shop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop}
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-shop} -d ${DB_DATABASE:-shop}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Virus scanning of seller uploads (clamd on 3310). Needs outbound access to
  # database.clamav.net for signature updates (freshclam runs inside the image).
  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamdb:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    restart: unless-stopped

  # Scheduled, encrypted, off-site backups (enable with --profile backup).
  # Needs BACKUP_AGE_RECIPIENT (age public key) and optionally an rclone remote.
  backup:
    image: postgres:15-alpine
    profiles: ["backup"]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        apk add --no-cache age rclone >/dev/null &&
        echo "${BACKUP_CRON:-15 2 * * *} cd /app && /app/scripts/backup.sh /backups >> /proc/1/fd/1 2>&1" > /etc/crontabs/root &&
        crond -f -l 8
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE:-shop}
      DB_USERNAME: ${DB_USERNAME:-shop}
      DB_PASSWORD: ${DB_PASSWORD:-shop}
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_RCLONE_REMOTE: ${BACKUP_RCLONE_REMOTE:-}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts:/app/scripts:ro
      - storage:/app/storage:ro
      - backups:/backups
      - ${RCLONE_CONFIG_DIR:-./docker/rclone}:/root/.config/rclone:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  shkeeper-mock:
    image: php:8.3-cli-alpine
    working_dir: /mock
    command: ["php", "-S", "0.0.0.0:8081", "server.php"]
    environment:
      MOCK_API_KEY: ${SHKEEPER_API_KEY:-dev-api-key}
      MOCK_STATE_FILE: /tmp/shkeeper-mock.json
    volumes:
      - ./docker/shkeeper-mock:/mock:ro
    profiles: ["mock", "test"]

volumes:
  pgdata:
  storage:
  clamdb:
  backups:
