# Hostile-conditions simulation stack (docs/SIMULATION.md). Never use in production.
#
#   tests/simulation/run.sh up      # build, start, migrate, seed
#   tests/simulation/run.sh all     # every phase, five consecutive runs
#
# Adds Mailpit, a clamd stand-in, a TLS front end and the Shkeeper mock with
# failure modes; turns on debug logging and PostgreSQL logging of every data
# change and of queries slower than 200 ms. Product uploads live on a small
# size-limited volume so a full disk can be simulated.

x-sim-env: &sim-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://localhost:8443
  LOG_CHANNEL: json
  LOG_LEVEL: debug
  SESSION_SECURE_COOKIE: "true"
  MAIL_MAILER: smtp
  MAIL_SCHEME: smtp
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  MAIL_FROM_ADDRESS: shop@sim.test
  SHKEEPER_BASE_URL: http://shkeeper-mock:8081
  SHKEEPER_API_KEY: sim-api-key-0123456789
  SHKEEPER_WEBHOOK_SECRET: sim-api-key-0123456789
  SHKEEPER_CALLBACK_URL: http://web:8080/webhooks/shkeeper
  SHKEEPER_PAYOUTS_ENABLED: "true"
  SHKEEPER_PAYOUT_USERNAME: payout-user
  SHKEEPER_PAYOUT_PASSWORD: payout-password
  SHKEEPER_PAYOUT_FEES: "BTC:10,LTC:10"
  SHKEEPER_PAYOUT_CALLBACK_URL: http://web:8080/webhooks/shkeeper/payouts
  SHKEEPER_CRYPTOS: BTC,LTC,ETH
  SHOP_VIRUS_SCAN: required
  CLAMAV_HOST: fakeclamd
  CLAMAV_PORT: "3310"
  METRICS_TOKEN: sim-metrics-token
  SHOP_SUPPORT_EMAIL: support@sim.test

x-sim-app: &sim-app
  env_file: [.env, tests/simulation/sim.env]
  volumes:
    - storage:/var/www/html/storage
    - uploads:/var/www/html/storage/app/private/products

services:
  app:
    <<: *sim-app
    environment:
      <<: *sim-env
      DB_HOST: db
      RUN_MIGRATIONS: "true"
  queue:
    <<: *sim-app
    environment:
      <<: *sim-env
      DB_HOST: db
  scheduler:
    <<: *sim-app
    environment:
      <<: *sim-env
      DB_HOST: db

  db:
    command:
      - postgres
      - -c
      - log_min_duration_statement=200
      - -c
      - log_statement=mod
      - -c
      - log_line_prefix=%m [%p] %u@%d
    ports:
      - "127.0.0.1:5433:5432"

  # Real ClamAV needs database.clamav.net for signatures; the stand-in speaks
  # the clamd protocol (PING, INSTREAM) and flags the EICAR test file.
  clamav:
    profiles: ["real-clamav"]
  fakeclamd:
    image: python:3.12-alpine
    command: ["python3", "-I", "/fakeclamd.py"]
    volumes:
      - ./docker/test/fakeclamd.py:/fakeclamd.py:ro

  shkeeper-mock:
    environment:
      MOCK_API_KEY: sim-api-key-0123456789
      MOCK_STATE_FILE: /tmp/shkeeper-mock.json
      PHP_CLI_SERVER_WORKERS: "8"
    ports:
      - "127.0.0.1:8081:8081"

  mailpit:
    image: axllent/mailpit:v1.21.8
    ports:
      - "127.0.0.1:8025:8025"

  tls:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./docker/test/tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tests/simulation/tls:/etc/nginx/tls:ro
    depends_on:
      - web

volumes:
  # Small on purpose: the disk-full scenario fills it.
  uploads:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=64m,uid=82,gid=82
