# Simulation host backend: TLS on 8443 for browsers, plain 8080 for the internal
# Shkeeper callback network. PHP-FPM is not installable offline here, so
# requests are proxied to PHP's built-in server on 127.0.0.1:8000.
map $http_upgrade $connection_upgrade { default ""; }
server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    server_tokens off;
    client_max_body_size 55m;
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
server {
    listen 8080;
    server_name _;
    server_tokens off;
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }
}
