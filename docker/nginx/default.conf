# TLS is expected to terminate here in production (mount certificates and add
# a listen 443 ssl block) or at an upstream load balancer.

# Layouts link CSS and JS with a content hash (?v=..., see static_asset() in
# app/helpers.php), so those URLs change on every deploy that changes the file
# and can be cached for a year. Anything requested without it gets one hour.
map $arg_v $static_cache_control {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 55m;

    # Static assets are served directly; everything else goes to Laravel.
    location ~* \.(css|js|ico|png|svg|woff2?)$ {
        add_header Cache-Control $static_cache_control;
        add_header X-Content-Type-Options "nosniff" always;
        # Text assets only. HTML pages are not compressed on purpose: they carry
        # the CSRF token next to reflected input (the search box), which is what
        # BREACH needs; they are small and dynamic anyway.
        gzip on;
        gzip_comp_level 6;
        gzip_min_length 512;
        gzip_vary on;
        gzip_types text/css application/javascript text/javascript image/svg+xml;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        # Resolve "app" on every request (Docker's DNS, cached 10 s): a recreated
        # app container gets a new address, and a name resolved once at start-up
        # would keep pointing at the old one (502 until nginx restarts).
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
        # Room for long redirect URLs and cookies in response headers (the
        # 4-8 KB default answered 502 to a redirect after a long query string).
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
    }

    # No other PHP file is executable, and dotfiles are never served.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
