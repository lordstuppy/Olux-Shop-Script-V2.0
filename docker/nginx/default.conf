# TLS is expected to terminate here in production (mount certificates and add
# a listen 443 ssl block) or at an upstream load balancer.
server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 55m;

    # Static assets are served directly; everything else goes to Laravel.
    location ~* \.(css|js|ico|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # No other PHP file is executable, and dotfiles are never served.
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}
