name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

# Least privilege for the workflow token: the jobs only read the repository.
permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: shop
      DB_PASSWORD: shop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, zip, gd, sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Dependency vulnerability audit
        run: composer audit --no-interaction
      - run: ./scripts/check-ascii.sh
      - run: vendor/bin/pint --test
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  # Security release gate (docs/security/security-audit-summary.md): dependency
  # advisories, secret scan of the full history, static analysis with the
  # project rules, container configuration and the runtime image. Any failure
  # or any check that cannot run fails the job; make it a required check.
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, zip, gd, sodium
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: python3 -m pip install --user semgrep==1.180.0
      - name: Build the runtime image
        run: docker build -t digital-goods-shop:ci .
      - name: Security gate
        run: GATE_IMAGE=digital-goods-shop:ci OUT="$RUNNER_TEMP/security-gate" scripts/security-gate.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-gate
          path: ${{ runner.temp }}/security-gate

  browser:
    runs-on: ubuntu-24.04
    needs: php
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, zip, gd, sodium, curl
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=local/; s/^DB_PASSWORD=.*/DB_PASSWORD=shop/; s/^MAIL_MAILER=.*/MAIL_MAILER=log/' .env
          php artisan key:generate
      - run: cd tests/browser && npm install --no-fund && npm audit --audit-level=high && npx playwright install --with-deps chromium
      - run: ./tests/browser/run.sh

  # End-to-end run on a production-like stack (nginx TLS, queue worker,
  # scheduler, PostgreSQL 15, Shkeeper mock). Takes about 8 minutes because it
  # waits for the 5-minute payment reconciliation, so it runs weekly and on demand.
  live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    needs: php
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, intl, zip, gd, sodium, curl
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: LIVE_DIR=/tmp/shop-live ./tests/live/run.sh all
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-test-logs
          path: /tmp/shop-live/logs
