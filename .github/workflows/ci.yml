name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

# Least privilege for the workflow token: the jobs only read the repository.
permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: shop
      DB_PASSWORD: shop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, gd, sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Dependency vulnerability audit
        run: composer audit --no-interaction
      - run: ./scripts/check-ascii.sh
      - run: vendor/bin/pint --test
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  # Security release gate (docs/security/security-audit-summary.md): dependency
  # advisories, secret scan of the full history, static analysis with the
  # project rules, container configuration and the runtime image. Any failure
  # or any check that cannot run fails the job; make it a required check.
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, gd, sodium
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: python3 -m pip install --user semgrep==1.180.0
      - name: Build the runtime images
        run: |
          docker build -t digital-goods-shop:ci .
          docker build -t digital-goods-shop-web:ci docker/nginx
      - name: Security gate
        run: GATE_IMAGE="digital-goods-shop:ci digital-goods-shop-web:ci" OUT="$RUNNER_TEMP/security-gate" scripts/security-gate.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-gate
          path: ${{ runner.temp }}/security-gate

  # Performance and code quality gate (docs/performance/performance-audit-summary.md):
  # style, static analysis, query budgets and performance regression tests,
  # asset and image size budgets. Latency and Web Vitals budgets need the
  # simulation stack with the performance dataset and are reported as not
  # verified here (see tests/performance/README.md). Make it a required check.
  performance:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: shop
      DB_PASSWORD: shop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, gd, sodium
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Build the runtime images
        run: |
          docker build -t digital-goods-shop:ci .
          docker build -t digital-goods-shop-web:ci docker/nginx
      - name: Performance gate
        run: GATE_IMAGE="digital-goods-shop:ci digital-goods-shop-web:ci" OUT="$RUNNER_TEMP/performance-gate" scripts/performance-gate.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: performance-gate
          path: ${{ runner.temp }}/performance-gate

  browser:
    runs-on: ubuntu-24.04
    needs: php
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, gd, sodium, curl
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=local/; s/^DB_PASSWORD=.*/DB_PASSWORD=shop/; s/^MAIL_MAILER=.*/MAIL_MAILER=log/' .env
          php artisan key:generate
      - run: cd tests/browser && npm install --no-fund && npm audit --audit-level=high && npx playwright install --with-deps chromium
      # Also the UX regression gate (docs/ux): ux.spec.js, and the accessibility
      # scan (WCAG 2.2 AA) in light, dark and on a phone viewport.
      - run: ./tests/browser/run.sh
      - name: Keep screenshots and traces of failed browser checks
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-results
          path: tests/browser/test-results
          retention-days: 14

  # End-to-end run on a production-like stack (nginx TLS, queue worker,
  # scheduler, PostgreSQL 18, Shkeeper mock). Takes about 8 minutes because it
  # waits for the 5-minute payment reconciliation, so it runs weekly and on demand.
  live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    needs: php
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, gd, sodium, curl
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: LIVE_DIR=/tmp/shop-live ./tests/live/run.sh all
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-test-logs
          path: /tmp/shop-live/logs

  # Final functional release gate (docs/functional): PHPUnit and browser suites,
  # the simulation (phases 1-6, 8-12: journeys, payments, races with barriers,
  # gateway and infrastructure failures) on the production image, the load
  # profiles (baseline, contention, target load, spike, stress, soak) and the
  # year-scale dataset, then tests/functional/matrix.py decides from those
  # results alone. Takes about 3 hours, so it runs weekly (scheduled
  # adversarial and stress testing) and on demand for a release candidate.
  # It only ever targets the disposable stack it starts on the runner.
  functional:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    needs: [php, browser]
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop -d shop" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_USERNAME: shop
      DB_PASSWORD: shop
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: pdo_pgsql, intl, zip, gd, sodium, curl
          coverage: none
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Configure
        run: |
          cp .env.example .env
          sed -i 's/^APP_ENV=.*/APP_ENV=local/; s/^DB_PASSWORD=.*/DB_PASSWORD=shop/; s/^MAIL_MAILER=.*/MAIL_MAILER=log/' .env
          php artisan key:generate
          PGPASSWORD=shop psql -h 127.0.0.1 -U shop -d shop -c 'CREATE DATABASE shop_test'
      - run: cd tests/browser && npm ci --no-fund && npx playwright install --with-deps chromium
      - name: Install k6 (checksum pinned)
        run: |
          curl -fsSL -o /tmp/k6.tgz https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz
          echo "c7f03434854f837b6790ee81572e4b0f955241974c79a43cbb9f8d0fef069589  /tmp/k6.tgz" | sha256sum -c -
          tar -xzf /tmp/k6.tgz -C /tmp && sudo install /tmp/k6-v0.54.0-linux-amd64/k6 /usr/local/bin/k6
      - name: Functional gate
        run: OUT="$RUNNER_TEMP/functional-gate" scripts/functional-gate.sh
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: functional-gate
          path: |
            ${{ runner.temp }}/functional-gate
            tests/simulation/reports
            docs/functional/functional-gates.json
            docs/functional/scenario-matrix.md
          retention-days: 30
